    <title>预见航行 · FORESEA</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eaece3;
        --ink: #193f3d;
        --muted: #4f7166;
        --line: rgba(25, 63, 61, 0.12);
        --surface: #f7f6ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.7;
      }
      main {
        width: min(820px, calc(100% - 32px));
        margin: 40px auto;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
      }
      h1 { font-size: 32px; margin: 0 0 8px; font-weight: 500; }
      .meta { color: var(--muted); }
      a { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>预见航行</h1>
      <p class="meta">FORESEA · iPhone 横屏航海游戏</p>
      <p>掌好舵，去更远的海。油门和舵轮很快到位，船体要过一阵才跟上。金色 + 落在来船航路上，提前下指令，临近猛推来不及。</p>
      <p>An inertial sailing game for iPhone. The throttle and wheel answer at once; the hull does not. Fuel sits on someone else’s course. Decide early.</p>
