<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillwater Voyage</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eaece3;
        --ink: #193f3d;
        --muted: #4f7166;
        --line: rgba(25, 63, 61, 0.12);
        --surface: #f7f6ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.7;
      }
      main {
        width: min(820px, calc(100% - 32px));
        margin: 40px auto;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
      }
      h1 { font-size: 32px; margin: 0 0 8px; font-weight: 500; }
      .meta { color: var(--muted); }
      a { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>Stillwater Voyage</h1>
      <p class="meta">An inertial sailing game for iPhone and iPad.</p>
      <p>
        Helm a heavy cargo ship. The throttle and wheel answer at once; the hull does not.
        Fuel sits on someone else’s course. Decide early.
      </p>
      <p>
        <a href="./support.html">Support</a>
        ·
        <a href="./privacy-policy.html">Privacy Policy</a>
      </p>
    </main>
  </body>
</html>
